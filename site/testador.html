<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Testador</title>
    <link rel="stylesheet" href="css/testador.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>


<div class="container">
    <div class="row">
        <div class="col">
            <header>

                <h1>Testador</h1>

                <p>Este site é um testador de páginas HTML. Ele será utilizado no decorrer da disciplina para verificar
                    a implementação
                    dos recursos vistos em aula.</p>

                <p>Faça upload de um arquivo HTML para verificar se os elementos básicos estão presentes.</p>

                <div class="mb-3">
                    <label for="fileInput" class="form-label">Faça upload do arquivo aqui</label>
                    <input class="form-control" type="file" id="fileInput" accept=".html,.htm">
                </div>
            </header>
            <main id="div-main">
                <p class="d-inline-flex gap-1">
                    <a class="btn btn-primary" data-bs-toggle="collapse" href="#class1CollapseDiv" role="button"
                       aria-expanded="false" aria-controls="collapseExample">
                        Aula 1
                    </a>
                </p>
                <div class="collapse" id="class1CollapseDiv">
                    <div class="card card-body" id="class1CollapseCard">
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script type="application/javascript" src="js/testador.js"></script>

</html>
