<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Testador</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col">
            <header>
                <h1>Testador</h1>

                <p>Este site é um testador de páginas HTML. Ele será utilizado no decorrer da disciplina para verificar
                    a implementação dos recursos vistos em aula.</p>

                <p>Faça upload dos arquivos do seu site (.html, .css, .js) para fazer as verificações.</p>
            </header>
            <main id="div-main">
                <div class="modal fade" id="modalError" tabindex="-1" aria-labelledby="modalErrorLabel" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-body">
                                Você precisa submeter um diretório para ser verificado!
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Fechar</button>
                            </div>
                        </div>
                    </div>
                </div>


                <div id="mainGridDiv" class="d-grid gap-3">
                    <div class="input-group mb-3">
                        <div class="input-group mb-3">
                            <label class="input-group-text" for="fileInput">Arquivo</label>
                            <input class="form-control" type="file" id="fileInput" multiple webkitdirectory accept=".html,.htm,.css,.js">
                        </div>
                        <div class="input-group mb-3">
                            <button class="btn btn-primary" id="buttonRunChecks">Verificar</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script type="module">
    import { ClassOneTester, ClassTwoTester, ClassThreeTester } from './js/src/classes.js';
    import { ClassTester } from "./js/src/utils/testers.js";

    new ClassTester('buttonRunChecks', 'click', ClassOneTester, 1, document.getElementById('mainGridDiv'));
    new ClassTester('buttonRunChecks', 'click', ClassTwoTester, 2, document.getElementById('mainGridDiv'));
    new ClassTester('buttonRunChecks', 'click', ClassThreeTester, 3, document.getElementById('mainGridDiv'));
</script>
</html>
