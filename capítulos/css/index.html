<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<title>Olá mundo!</title>
	<style>
		.navbar {
			background-color: lightgrey;
			width: 100%;
			height: 10vh;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.navbar-child-left {
			justify-content: left;
		}

		.navbar-child-right {
			justify-content: right;
		}

		.navbar-item {
			padding-left: 5px;
			padding-right: 5px;
		}

	</style>
</head>
<body>
	<nav class="navbar">
		<div class="navbar-child-left">
			<a class="navbar-item" href="https://google.com">Google</a>
			<a class="navbar-item" href="https://instagram.com">Instagram</a>
		</div>
		<div class="navbar-child-right">
			<a class="navbar-item" href="https://google.com">Google</a>
			<a class="navbar-item" href="https://instagram.com">Instagram</a>
		</div>
	</nav>

	<h1>Olá mundo!</h1>
	<p>Sou um parágrafo.</p>
</body>
</html>
