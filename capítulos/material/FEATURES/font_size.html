<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trocar fonte</title>
</head>
<body>
    <h1>Trocar fonte</h1>
    
    <p id="texto">
        Use os botões abaixo para trocar o tamanho da fonte desse texto.
    </p>
    
    <button id="aumentar">
        A+
    </button>
    
    <button id="diminuir">
        A-
    </button>
</body>
<script>
    // size é uma variável "global". Ela está disponível dentro do contexto
    // das funções, apesar de não ser passada por parâmetro para as funções
    let size = 16;
    function aumentarFonte() {
        let text = document.getElementById('texto');
        size += 2;
        text.style.fontSize = size + "px";
    }

    function diminuirFonte() {
        let text = document.getElementById('texto');
        size -= 2;
        text.style.fontSize = size + "px";
    }

    document.getElementById('aumentar').addEventListener('click', aumentarFonte);
    document.getElementById('diminuir').addEventListener('click', diminuirFonte);

</script>
</html>
