<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trocar fonte</title>
</head>
<body>
    <h1>Trocar fonte</h1>

    <button id="aumentar">
        A+
    </button>

    <button id="diminuir">
        A-
    </button>

    <p id="texto">
        Use os botões abaixo para trocar o tamanho da fonte desse texto.
    </p>
</body>
<script>
    // size e text são variáveis "globais". Elas estão disponíveis dentro do
    // contexto das funções, apesar de não serem passadas por parâmetro
    let size = 16;
    let text = document.getElementById('texto');

    function aumentarFonte() {
        size += 2;
        text.style.fontSize = `${size}px`;
    }

    function diminuirFonte() {
        size -= 2;
        text.style.fontSize = `${size}px`;
    }

    document.getElementById('aumentar').addEventListener('click', aumentarFonte);
    document.getElementById('diminuir').addEventListener('click', diminuirFonte);
</script>
</html>
