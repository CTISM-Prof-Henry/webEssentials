<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esconder conteúdo</title>
    <style>
        #marvin {
            visibility: hidden;  /* começa escondido */
        }
    </style>
</head>
<body>
<h1>Esconder conteúdo</h1>

<p>
    Use o botão abaixo para mostrar a imagem.
</p>

<button id="alternar">
    Mostrar
</button>
<br/>
<br/>

<!-- imagem começa oculta com display: none -->
<img alt="um cachorro chamado marvin" id="marvin" src="../../../imagens/marvin.jpg"/>
</body>
<script>
    let button = document.getElementById('alternar');

    function alternar() {
        // seleciona a imagem usando seu id
        let imagem = document.getElementById('marvin');

        // se a imagem está oculta
        if (imagem.style.visibility === 'visible') {
            imagem.style.visibility = 'hidden';
            button.textContent = 'Esconder';  // troca texto do botão
        } else {  // se a imagem estiver visível
            imagem.style.visibility = 'visible';
            button.textContent = 'Mostrar';  // troca o texto do botão
        }
    }
    button.addEventListener('click', alternar);
</script>
</html>
