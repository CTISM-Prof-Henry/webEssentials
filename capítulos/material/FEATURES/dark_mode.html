<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tema escuro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<h1>Tema escuro</h1>

<p>Clique no botão abaixo para trocar o tema.</p>

<button id="themeButton">
    Trocar tema
</button>

<script>
    let ativo = true;

    function trocarTema() {
        ativo = !ativo;
        if(ativo) {
            document.body.style.backgroundColor = '#fff';
            document.body.style.color = '#222';
        } else {
            document.body.style.backgroundColor = '#222';
            document.body.style.color = '#fff';
        }
    }
    document.getElementById('themeButton').addEventListener('click', trocarTema);
</script>

</body>
</html>
