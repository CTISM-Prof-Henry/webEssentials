<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <title>Objetos e Local Storage</title>
</head>
<body>
<h1>Objetos e Local Storage</h1>

<p>Exemplo de como armazenar e recuperar objetos com local storage.</p>

<form onsubmit="return false">
    <label for="input-nome-pessoa">Nome:</label>
    <input type="text" name="input-nome-pessoa" id="input-nome-pessoa">
    <br/>
    <br/>
    <label for="input-idade-pessoa">Idade:</label>
    <input type="text" name="input-idade-pessoa" id="input-idade-pessoa">
    <br/>
    <br/>
    <input type="submit" id="button-enviar" value="Enviar">
    <input type="button" id="button-limpar" value="Limpar">
</form>

<h2>Pessoas armazenadas na memória RAM</h2>
<p id="paragrafo-valores-locais">Nenhum valor armazenado.</p>

<h2>Pessoas armazenadas no localStorage</h2>
<p id="paragrafo-valores-local-storage">Nenhum valor armazenado.</p>
</body>
<script type="application/javascript">
    class Pessoa {
        constructor(nome, idade) {
            this.nome = nome;
            this.idade = idade;
        }

        toJSONString() {
            return JSON.stringify(this);
        }

        static fromJSONString(jsonString) {
            const obj = JSON.parse(jsonString);
            return new Pessoa(obj.nome, obj.idade);
        }
    }

    function salvarValor(event) {
        event.preventDefault();
        const nome = document.getElementById('input-nome-pessoa').value;
        const idade = document.getElementById('input-idade-pessoa').value;
        const pessoa = new Pessoa(nome, idade);
        localStorage.setItem(nome, pessoa.toJSONString());
    }
    function mostrarValores() {
        let array = [];
        let keys = Object.keys(localStorage);
        for (let i = 0; i < keys.length; i++) {
            const pessoa = Pessoa.fromJSONString(localStorage.getItem(keys[i]));
            array.push(`${pessoa.nome} - ${pessoa.idade}`);
        }
        document.getElementById('paragrafo-valores-local-storage').innerHTML = array.join('<br/>');
    }
    function limparValores() {
        console.log('local storage limpo!');
        localStorage.clear();
        mostrarValores();
    }
    function mostrarValoresLocais() {
        let nome = document.getElementById('input-nome-pessoa').value;
        let idade = document.getElementById('input-idade-pessoa').value;
        let pessoa = new Pessoa(nome, idade);
        document.getElementById('paragrafo-valores-locais').innerHTML = `${pessoa.nome} - ${pessoa.idade}`;
    }

    document.getElementById('input-nome-pessoa').addEventListener('input', mostrarValoresLocais);
    document.getElementById('input-idade-pessoa').addEventListener('input', mostrarValoresLocais);
    mostrarValoresLocais();

    document.getElementById('button-enviar').addEventListener('click', salvarValor);
    document.getElementById('button-enviar').addEventListener('click', mostrarValores);
    document.getElementById('button-limpar').addEventListener('click', limparValores);
    mostrarValores();
</script>
</html>
