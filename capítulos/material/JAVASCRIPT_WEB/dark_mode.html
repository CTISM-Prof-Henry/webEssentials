<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tema escuro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            transition: 0.3s;
        }
    </style>
</head>
<body>
<h1>Tema escuro</h1>

<p>Clique no botão abaixo para trocar o tema.</p>

<button id="botao-tema">
    Trocar tema
</button>
</body>
<script>
    let tema_claro = true;  // começa com valor verdadeiro (true)

    function trocarTema() {
        tema_claro = !tema_claro;  // troca de true pra false e de false pra true
        if(tema_claro) {
            document.body.style.backgroundColor = '#fff';  // plano de fundo branco
            document.body.style.color = '#222';  // cor do texto preta
        } else {  // senão, se é tema escuro
            document.body.style.backgroundColor = '#222';  // cor fundo preta
            document.body.style.color = '#fff';  // cor do texto branca
        }
    }
    document.getElementById('botao-tema').addEventListener('click', trocarTema);
</script>
</html>
