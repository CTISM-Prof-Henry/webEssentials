<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galeria</title>
</head>
<body>
<h1>Galeria</h1>

<p>Passe o mouse por cima das imagens abaixo.</p>

<img
    id='imagem_principal'
    src='https://picsum.photos/id/10/400/300'
    width='370px'
>
<br/>
<br/>
<img src='https://picsum.photos/id/10/400/300' class='menor' width='120px'>
<img src='https://picsum.photos/id/20/400/300' class='menor' width='120px'>
<img src='https://picsum.photos/id/30/400/300' class='menor' width='120px'>
</body>
<script>
    let principal = document.getElementById('imagem_principal');  // 1 elemento
    let imagens = document.getElementsByClassName('menor');  // array com 3 elementos

    for(let i = 0; i < imagens.length; i++) {
        imagens[i].addEventListener('mouseover', () => { // arrow function
            principal.src = imagens[i].src;
        });
    }
</script>
</html>
