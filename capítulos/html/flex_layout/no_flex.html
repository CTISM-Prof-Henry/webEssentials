<!DOCTYPE html>
<html>
<head>
<style>
.container {
  /**display: flex;**/
  background-color: DodgerBlue;
}

.container div {
  background-color: #f1f1f1;
  margin: 10px;
  padding: 20px;
  font-size: 24px;
}
</style>
</head>
<body>

<h1>Create a Flex Container</h1>

<div class="container">
  <div>Item 1</div>
  <div>Item 2</div>
  <div>Item 3</div>  
  <div>Item 4</div>
  <div>Item 5</div>
</div>

<p>Flexbox must have a parent element with the display property set to flex or inline-flex.</p>
<p>Elementos que são filhos do container flex automaticamente se transformam em itens flex.</p>
<p>Adaptado do <a href="https://www.w3schools.com/css/css3_flexbox.asp">W3 Schools</a></p>
<p>Tipos de display: <a href="https://www.w3schools.com/cssref/pr_class_display.php">Link</a></p>

</body>
</html>
